<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic portal controls player</title>
<style>
  body { margin: 0; min-height: 1600px; }
  .page-section { padding: 24px; }
  .react-ecp { position: relative; width: 800px; max-width: 100%; background: #000; }
  .bitmovinplayer-container { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  video { width: 100%; height: 100%; background: #222; }
  #controls-clip { position: absolute; inset: 0; z-index: 20; color: white; pointer-events: auto; }
  #toolbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: rgba(0,0,0,.75); }
  .bitmovinplayer-poster { position: absolute; inset: 0; z-index: 5; }
  .article-body { padding: 24px; max-width: 640px; }
</style>
</head>
<body>
  <main class="page-section">
    <div class="react-ecp" tabindex="-1">
      <div id="inline-player-clip" class="bitmovinplayer-container aspect-16x9">
        <video id="portal-video"></video>
        <div class="bitmovinplayer-poster">Poster</div>
      </div>
      <div id="controls-clip" class="controls_main_controls__PX0ZA controls_show__lQbUe">
        <div id="overlay"><div class="controls_videoControlsTouch__gTSlN">Tap layer</div></div>
        <div id="toolbar" class="controls_toolbar__v-xnU">Custom toolbar</div>
      </div>
    </div>
    <div class="article-body" id="story-content">Story content below the player remains visible.</div>
  </main>
  <script>
    var video = document.getElementById('portal-video');
    video.src = 'blob:https://example.com/clip';
    setTimeout(function () {
      var wrapper = document.querySelector('.react-ecp');
      var controls = document.getElementById('controls-clip');
      if (wrapper && controls && controls.parentNode) {
        controls.parentNode.removeChild(controls);
        wrapper.appendChild(controls);
      }
    }, 500);
  </script>
</body>
</html>
