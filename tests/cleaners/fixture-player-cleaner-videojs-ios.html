<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video.js v10 / Media Chrome iOS promotion</title>
<style>
  body { margin: 0; background: #111; }
  .media-default-skin, .fave-player-container, .video-js {
    position: relative; width: 320px; aspect-ratio: 16 / 9; margin: 12px auto; background: #000;
  }
  video { width: 100%; height: 100%; background: #222; }
  .media-controls, .fave-controls, .vjs-control-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(0,0,0,.7);
  }
</style>
</head>
<body>
  <!-- videojs.org: Media Chrome skin, MSE blob on the element, real HLS on React props. -->
  <div id="hero" class="media-default-skin media-default-skin--video" role="group" aria-label="Media player">
    <video id="hero-video" playsinline crossorigin="anonymous"></video>
    <div class="media-controls" id="hero-controls">Play</div>
  </div>

  <!-- Same blob pipeline, but no discoverable native URL. iOS must leave it alone. -->
  <div id="opaque-only" class="media-default-skin">
    <video id="opaque-video" playsinline></video>
    <div class="media-controls" id="opaque-controls">Play</div>
  </div>

  <!-- CNN-style handshake plus a tempting React HLS URL. Must stay preserved. -->
  <div id="fave-shell" class="fave-player-container">
    <video id="fave-video" playsinline></video>
    <div class="fave-controls" id="fave-controls">Play</div>
  </div>

  <!-- Cached reload: video.js is still initializing when the promotion
       lands and re-attaches its MSE blob over the native URL. -->
  <div id="reload" class="media-default-skin">
    <video id="reload-video" playsinline></video>
    <div class="media-controls" id="reload-controls">Play</div>
  </div>

  <!-- Hearst (wisn.com): blob pipeline whose React ancestors only carry
       non-media URLs (an article link, a poster). Must stay on the blob. -->
  <div id="linked" class="media-default-skin">
    <video id="linked-video" playsinline></video>
    <div class="media-controls" id="linked-controls">Play</div>
  </div>

  <!-- Hearst with its rendition list: promote the tallest progressive MP4. -->
  <div id="hearst" class="media-default-skin">
    <video id="hearst-video" playsinline></video>
    <div class="media-controls" id="hearst-controls">Play</div>
  </div>

  <!-- Classic video.js API fallback beside a working blob. Must stay put. -->
  <div id="classic" class="video-js">
    <video id="classic-video" playsinline></video>
    <div class="vjs-control-bar" id="classic-controls">Play</div>
  </div>

  <script>
    (function () {
      var blob = 'blob:https://videojs.org/00000000-0000-0000-0000-000000000000';
      function attachBlob(id) {
        var video = document.getElementById(id);
        var source = document.createElement('source');
        source.type = 'video/mp4';
        source.src = blob;
        video.appendChild(source);
        try { video.src = blob; } catch (e) {}
      }
      function plantFiber(id, src) {
        document.getElementById(id).__reactFiber$fixture = {
          memoizedProps: { src: src },
          pendingProps: { src: src },
          return: null
        };
      }

      attachBlob('hero-video');
      attachBlob('reload-video');
      attachBlob('opaque-video');
      attachBlob('fave-video');
      attachBlob('classic-video');
      attachBlob('linked-video');
      attachBlob('hearst-video');
      var cdn = 'https://streaming.hearstdigitalstudios.com/b20d/';
      document.getElementById('hearst-video').__reactFiber$fixture = {
        memoizedProps: { className: 'player' },
        return: {
          memoizedProps: { video: { transcodings: [
            { key: 'b20d/video_16x9_240p_h264_sd.mp4', full_url: cdn + 'video_16x9_240p_h264_sd.mp4' },
            { key: 'b20d/video_16x9_720p_h264_hd.mp4', full_url: cdn + 'video_16x9_720p_h264_hd.mp4' },
            { key: 'b20d/master_e.4c61.mp4', full_url: cdn + 'master_e.4c61.mp4' }
          ] } },
          return: { memoizedProps: { url: 'https://www.wisn.com/article/road-rage-video/74083320' }, return: null }
        }
      };
      document.getElementById('linked-video').__reactFiber$fixture = {
        memoizedProps: { className: 'player' },
        return: {
          memoizedProps: { poster: { src: '/images/poster.jpg' } },
          return: { memoizedProps: { url: 'https://www.wisn.com/article/road-rage-video/74083320' }, return: null }
        }
      };
      plantFiber('hero-video', 'https://stream.mux.com/demo.m3u8');
      plantFiber('fave-video', 'https://stream.mux.com/should-not-promote.m3u8');
      plantFiber('reload-video', 'https://stream.mux.com/reload.m3u8');

      // Simulate cached-reload video.js: the first time the cleaner swaps
      // the element to a native URL mid-setup, the player re-attaches its
      // MSE blob over it a beat later.
      (function () {
        var video = document.getElementById('reload-video');
        var fought = false;
        video.addEventListener('loadstart', function () {
          var src = video.src || '';
          if (fought || !src || src.indexOf('blob:') === 0) { return; }
          fought = true;
          setTimeout(function () {
            try { video.src = blob; } catch (e) {}
            try { video.load(); } catch (e) {}
          }, 30);
        });
      })();

      window.videojs = {
        getPlayers: function () {
          return {
            classic: {
              el: function () { return document.getElementById('classic-video'); },
              currentSource: function () {
                return { src: 'https://example.com/classic.mp4', type: 'video/mp4' };
              }
            }
          };
        }
      };
    })();
  </script>
</body>
</html>
