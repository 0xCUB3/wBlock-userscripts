<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Autoplay</title>
  <style>
    video, audio { width: 160px; height: 90px; background: #111; display: block; }
    .row { display: flex; gap: 16px; }
    .player { position: relative; }
  </style>
</head>
<body>
  <video id="feed" autoplay muted playsinline></video>
  <div id="player" class="player">
    <video id="main" muted playsinline></video>
    <button id="play" type="button">Play</button>
  </div>
  <video id="other" muted playsinline></video>
</body>
</html>
