<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="https://example.com/details/archive/item">
<title>Shadow-root players (Archive.org/BBC-style)</title>
<style>
  #closed-player-frame { position: relative; width: 640px; height: 360px; background: #000; }
  test-closed-player { display: block; width: 100%; height: 100%; }
</style>
<script>
  (function () {
    var timing = window.__wblockShadowTiming = {
      createdAt: 0,
      nativeAt: 0,
      domContentLoadedAt: 0
    };

    document.addEventListener('DOMContentLoaded', function () {
      timing.domContentLoadedAt = performance.now();
    }, { once: true });

    customElements.define('test-play-av', class extends HTMLElement {
      constructor() {
        super();
        var root = this.attachShadow({ mode: 'open' });
        new MutationObserver(function () {
          var video = root.querySelector('video');
          if (!timing.nativeAt && video && video.controls &&
              video.hasAttribute('data-wblock-player-cleaner')) {
            timing.nativeAt = performance.now();
          }
        }).observe(root, { childList: true, subtree: true, attributes: true });

        timing.createdAt = performance.now();
        root.innerHTML = [
          '<div id="jw6" class="jwplayer jw-reset">',
          '  <div class="jw-wrapper">',
          '    <video class="jw-video" data-test-original="1" src="/download/archive/movie.mp4"></video>',
          '    <div class="jw-controls"><button>Play</button></div>',
          '  </div>',
          '</div>'
        ].join('');
      }
    });

    document.documentElement.appendChild(document.createElement('test-play-av'));
  })();
</script>
</head>
<body>
  Archive/BBC-style shadow player fixture
  <div id="closed-player-frame"></div>
  <script>
    customElements.define('test-closed-player', class extends HTMLElement {
      constructor() {
        super();
        var root = this.attachShadow({ mode: 'closed' });
        window.__wblockClosedPlayerRoot = root;
        root.innerHTML = [
          '<style>:host{display:block;width:100%;height:100%}.stage{position:relative;width:100%;height:100%}video{width:100%;height:100%}.controls{position:absolute;inset:0}</style>',
          '<div class="stage">',
          '  <video src="https://example.com/bbc/movie.mp4"></video>',
          '  <div class="controls"><button>Play</button></div>',
          '</div>'
        ].join('');
      }
    });
    document.getElementById('closed-player-frame').replaceChildren(document.createElement('test-closed-player'));
  </script>
</body>
</html>
