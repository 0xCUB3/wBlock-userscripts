<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic PBS/GPB Player Cleaner fixture</title>
<style>
  body { margin: 0; background: #f4f4f4; font: 16px/1.4 sans-serif; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  #pbs-title { margin: 16px; }
  .player-wrap { margin: 16px; }
  #pbs-wrap-copy { margin: 12px 0 0; max-width: 640px; }
  #player-videojs {
    position: relative;
    width: 640px;
    height: 400px;
    background: #0a1628;
  }
  #pbs-video { width: 640px; height: 360px; background: #111; display: block; }
  .vjs-control-bar, .vjs-big-play-button, .vjs-poster, .vjs-title-bar {
    position: absolute; z-index: 3;
  }
  .vjs-control-bar { left: 0; right: 0; bottom: 40px; height: 36px; background: rgba(0,0,0,.65); }
  .vjs-big-play-button { left: 50%; top: 40%; }
  .vjs-pbs-top-icons {
    position: absolute; top: 8px; left: 8px; z-index: 5;
  }
  .vjs-pbs-more {
    position: absolute; right: 12px; bottom: 8px; z-index: 5;
  }
  .vjs-pbs-status {
    position: absolute; left: 16px; top: 120px; z-index: 6;
    padding: 8px 12px; background: #402; color: #fff;
  }
  .vjs-error-display {
    position: absolute; left: 16px; top: 80px; z-index: 6;
    padding: 8px 12px; background: #600; color: #fff;
  }
  .vjs-pbs-status .vjs-error-display {
    position: static; margin-top: 8px;
  }
  .vjs-ad-container.preroll {
    position: absolute; right: 16px; top: 80px; z-index: 6;
    padding: 8px 12px; background: #333; color: #fff;
  }
  .VideoPlayer-module-scss-module__fake__video_player_container {
    position: relative;
    width: 640px;
    height: 360px;
    margin: 16px;
    background: #0a1628;
  }
  .VideoPlayerOverlay-module-scss-module__fake__video_player_overlay {
    position: absolute; inset: 0; z-index: 4;
    display: flex; justify-content: space-between; padding: 12px;
  }
  #pbs-iframe { width: 640px; height: 360px; border: 0; display: block; background: #000; }
  .PassportBenefitScreen-module__fake__passport_benefit {
    margin: 16px; padding: 12px; background: #123; color: #fff;
  }
</style>
</head>
<body>
  <header>PBS | gpb</header>

  <!-- A) In-player (iframe document): PBS video.js blob MSE + leftover chrome. -->
  <div class="player-wrap">
    <div id="player-videojs" class="vjs-pbs video-js micro-layout">
      <video id="pbs-video" class="vjs-tech" playsinline></video>
      <div class="vjs-poster">poster</div>
      <button class="vjs-big-play-button">Play</button>
      <div class="vjs-control-bar">PBS controls</div>
      <div class="vjs-pbs-top-icons">
        <button type="button">expand</button>
        <button type="button">extra</button>
      </div>
      <button type="button" class="vjs-pbs-more" aria-label="More">⋮</button>
      <div class="vjs-error-display" id="pbs-error">This video is not available</div>
      <div class="vjs-ad-container preroll" id="pbs-preroll">Skip Ad</div>
      <div id="pbs-protected-wrap" class="vjs-pbs-status">
        <button type="button" id="pbs-protected-more" aria-label="More">⋮</button>
        <button type="button" id="pbs-protected-share" title="Share">Share</button>
        <div class="vjs-error-display" id="pbs-wrap-error">Protected playback error</div>
      </div>
    </div>
    <p id="pbs-wrap-copy">Episode description stays visible</p>
  </div>

  <!-- B) Host page: absolute player.pbs.org iframe plus sibling overlay. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">
      <a class="nav_link" href="#">PBS logo</a>
      <button type="button" class="MyListButton">My List</button>
    </div>
    <iframe id="pbs-iframe" src="https://player.pbs.org/viralplayer/fixture/" title="PBS player"></iframe>
  </div>

  <h1 id="pbs-title">Grantchester</h1>
  <div class="PassportBenefitScreen-module__fake__passport_benefit">Passport paywall</div>

  <script>
    (function () {
      var video = document.getElementById('pbs-video');
      video.src = 'blob:https://player.pbs.org/00000000-0000-0000-0000-000000000000';
    })();
  </script>
</body>
</html>
