<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBS host iframe only</title>
<style>
  body { margin: 0; background: #f4f4f4; font: 16px/1.4 sans-serif; }
  header { padding: 12px 16px; background: #fff; }
  .VideoPlayer-module-scss-module__fake__video_player_container {
    position: relative; width: 640px; height: 360px; margin: 16px; background: #0a1628;
  }
  .VideoPlayerOverlay-module-scss-module__fake__video_player_overlay {
    position: absolute; inset: 0; z-index: 4; padding: 12px; color: #fff;
  }
  iframe { width: 640px; height: 360px; border: 0; display: block; background: #000; }
  .PassportBenefitScreen-module__fake__passport_benefit {
    margin: 16px; padding: 12px; background: #123; color: #fff;
  }
  .overlay-passport-nested {
    padding: 8px; background: #234; color: #fff;
  }
  .overlay-menu {
    margin: 0 8px 8px 0; padding: 6px 10px;
  }
</style>
</head>
<body>
  <header>PBS | gpb host</header>

  <!-- Absolute https://player.pbs.org — overlay should hide. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-real-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">real overlay</div>
    <iframe id="pbs-real-iframe" src="https://player.pbs.org/viralplayer/fixture/" title="PBS player"></iframe>
  </div>

  <!-- Suffix lookalike host — overlay stays visible. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-lookalike-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">lookalike overlay</div>
    <iframe id="pbs-lookalike-iframe" src="https://player.pbs.org.evil.example/viralplayer/fixture/" title="lookalike"></iframe>
  </div>

  <!-- Protocol-relative //player.pbs.org — overlay should hide. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-protocol-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">protocol overlay</div>
    <iframe id="pbs-protocol-iframe" src="//player.pbs.org/viralplayer/fixture/" title="protocol-relative PBS"></iframe>
  </div>

  <!-- Path-relative /viralplayer on video.gpb.org — overlay stays visible. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-path-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">path overlay</div>
    <iframe id="pbs-path-iframe" src="/viralplayer/fixture/" title="path-relative"></iframe>
  </div>

  <!-- Malformed prefixed URL — must not match embedded authority — overlay stays visible. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-malformed-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">malformed overlay</div>
    <iframe id="pbs-malformed-iframe" src="https://%zz//player.pbs.org/viralplayer/fixture/" title="malformed"></iframe>
  </div>

  <!-- Protected Passport UI nested inside candidate overlay — overlay and More/Share stay visible. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-protected-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">
      <button type="button" class="MyListButton" aria-label="My List">My List</button>
      <button type="button" id="pbs-protected-more" class="overlay-menu" aria-label="More">⋮</button>
      <button type="button" id="pbs-protected-share" class="overlay-menu" title="Share">Share</button>
      <div id="pbs-overlay-passport" class="overlay-passport-nested PassportBenefitScreen-module__fake__passport_benefit">
        Passport inside overlay
      </div>
    </div>
    <iframe id="pbs-protected-iframe" src="https://player.pbs.org/viralplayer/protected/" title="protected overlay"></iframe>
  </div>

  <!-- Malformed port authority — must not match player.pbs.org:evil.example — overlay stays visible. -->
  <div class="VideoPlayer-module-scss-module__fake__video_player_container">
    <div id="pbs-badport-overlay" class="VideoPlayerOverlay-module-scss-module__fake__video_player_overlay">bad port overlay</div>
    <iframe id="pbs-badport-iframe" src="https://player.pbs.org:evil.example/viralplayer/fixture/" title="bad port"></iframe>
  </div>

  <div class="PassportBenefitScreen-module__fake__passport_benefit">Passport paywall</div>
</body>
</html>
